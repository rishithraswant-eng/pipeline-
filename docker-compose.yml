version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: phantasm_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data:/data
    command: redis-server --save 60 1 --appendonly no --dir /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
